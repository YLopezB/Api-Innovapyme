name: CI - Api InnovaPyme

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
      - develop

jobs:
  build-and-smoke-test:
    name: Build, Prisma and Smoke Test
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: ${{ secrets.DB_PASSWORD }}
          MYSQL_DATABASE: ${{ vars.DATABASE_NAME }}
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    env:
      PORT: ${{ vars.PORT }}
      DATABASE_USER: ${{ secrets.DB_USER }}
      DATABASE_PASSWORD: ${{ secrets.DB_PASSWORD }}
      DATABASE_NAME: ${{ vars.DATABASE_NAME }}
      DATABASE_HOST: 127.0.0.1
      DATABASE_PORT: 3306
      DATABASE_URL: mysql://${{ secrets.DB_USER }}:${{ secrets.DB_PASSWORD }}@127.0.0.1:3306/${{ vars.DATABASE_NAME }}
      JWT_SECRET: ${{ secrets.JWT_SECRET }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ vars.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Run Prisma migrations
        run: npx prisma migrate deploy

      - name: Run seed
        run: npm run seed

      - name: Run integration tests
        run: npm run test:coverage

      # Guía para visualizar los reportes descargados desde los artefactos del CI:
      # 1. Descargar y descomprimir el archivo `test-and-coverage-report.zip`.
      # 2. Abrir la terminal en la carpeta descomprimida y ejecutar:
      #    - Para ver el reporte de pruebas: `npx serve html`
      #    - Para ver la cobertura de código: `npx serve coverage`
      - name: Upload Test Results and Coverage Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-and-coverage-report
          path: |
            coverage/
            html/
          retention-days: 14

      - name: Start API
        run: |
          npm start &
          sleep 10

      - name: Smoke test Swagger docs
        run: curl --fail http://localhost:${{ vars.PORT }}/docs
